name: telos
description: Productivity & accountability app built with Flutter, Riverpod, and Supabase.
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  go_router: ^14.2.0

  supabase_flutter: ^2.17.2

  flutter_dotenv: ^5.2.1

  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Useful for logging, etc.
  meta: ^1.15.0
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.10+1
  crystal_navigation_bar: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  freezed: ^2.5.7
  json_serializable: ^6.8.0

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - .env.dev
    - assets/icons/

