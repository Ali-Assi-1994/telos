name: telos
description: Productivity & accountability app built with Flutter, Riverpod, and Supabase.
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  go_router: ^18.0.1

  supabase_flutter: ^2.17.2

  flutter_dotenv: ^6.0.1

  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Useful for logging, etc.
  meta: ^1.15.0
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  crystal_navigation_bar: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  freezed: ^4.0.2
  json_serializable: ^6.14.1

  flutter_lints: ^6.0.0
  patrol: 4.10.0
  patrol_mcp: ^0.2.1

flutter:
  uses-material-design: true

  assets:
    - .env.dev
    - assets/icons/

patrol:
  app_name: Telos
  test_directory: integration_test
  android:
    package_name: com.example.telos
  ios:
    bundle_id: com.example.telos

